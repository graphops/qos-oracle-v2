[package]
name = "qos_graphql_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
async-graphql = "4"
async-graphql-actix-web = "4"
clickhouse = { version = "0.11", features = ["uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"