[package]
name = "qos-oracle-v2"
version = "0.1.0"
edition = "2021"
description = "Standalone QoS Oracle for the Graph Network"

[workspace]
members = [".", "datasource", "migration", "entity"]

[dependencies]
alloy-primitives = "0.5.4"
anyhow = "1.0.79"
async-graphql = "7.0.0"
async-graphql-axum = "7.0.0"
async-trait = "0.1.77"
axum = "0.7.4"
axum-extra = { version = "0.9.1", features = ["typed-header"] }
bigdecimal = "0.4.3"
chrono = "0.4.31"
datasource = { path = "./datasource" }
eventuals = "0.6.7"
futures = "0.3.30"
graph-subscriptions = { git = "https://github.com/edgeandnode/subscription-payments", rev = "05dfc4d" }
headers = "0.4"
num-traits = "0.2.19"
prometheus = { version = "0.13.3", default-features = false }
reqwest = { version = "0.11.23", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "trust-dns",
] }
serde = "1.0.195"
serde_json = "1.0.111"
serde_with = { version = "3.4", features = ["chrono_0_4"] }
sha3 = "0.10.8"
thegraph = { git = "https://github.com/edgeandnode/toolshed", tag = "thegraph-v0.2.0", features = ["subgraph-client"] }
thiserror = "1.0.56"
tokio = { version = "1.35.1", features = ["macros", "rt-multi-thread"] }
toolshed = { git = "https://github.com/edgeandnode/toolshed", tag = "v0.4.0" }
tower-http = { version = "0.5.1", features = ["cors"] }
tracing = {  version = "0.1.40", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
    "parking_lot",
    "json",
] }


